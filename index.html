<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NookGym · Ümitköy'de birebir Personal Trainer stüdyosu</title>
<meta name="description" content="NookGym — Ümitköy'de birebir Personal Trainer stüdyosu. Gordion AVM karşısı · Nokta Ankara.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{--zemin:#0D0C0A;--amber:#CA9F6C;--acik:#F4DEB2;--bronz:#8B6843}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--zemin);color:var(--acik);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
  main{max-width:560px;display:grid;gap:28px;justify-items:center}
  img{width:min(260px,62vw);height:auto}
  h1{font-size:clamp(1.15rem,4.2vw,1.45rem);font-weight:600;letter-spacing:.01em;line-height:1.4}
  p{color:#cdbb98;line-height:1.6}
  a.btn{display:inline-block;min-height:52px;padding:15px 26px;border-radius:999px;background:var(--amber);color:var(--zemin);font-weight:700;text-decoration:none}
  a.btn:focus-visible{outline:3px solid var(--acik);outline-offset:3px}
  .cizgi{width:64px;height:1px;background:var(--bronz)}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-583x627.webp" width="583" height="627" alt="NookGym logosu">
  <h1>Ümitköy'de birebir Personal Trainer stüdyosu</h1>
  <div class="cizgi" aria-hidden="true"></div>
  <p>Gordion AVM karşısı · Nokta Ankara</p>
  <a class="btn" href="https://instagram.com/nookgym_" rel="noopener">Instagram'dan yaz · @nookgym_</a>
</main>
</body>
</html>
